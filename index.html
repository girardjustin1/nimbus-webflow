<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Generated by Untitled UI CLI" />
        <meta name="theme-color" content="#08c6c7" />

        <!-- Nimbus brand font: Proxima Nova, self-hosted (family "Proximanova").
             Same woff2/otf files installed in Webflow — declared here so Storybook
             renders the brand font without the Adobe Typekit kit. Weights: 300/400/
             600/700/800 (no italic faces). Inter (below) remains as fallback. -->
        <link rel="preconnect" href="https://cdn.prod.website-files.com" crossorigin />
        <style>
            @font-face {
                font-family: "Proximanova";
                font-weight: 300;
                font-style: normal;
                font-display: swap;
                src: url("https://cdn.prod.website-files.com/6900d7d25b1ef1963248262d/69bad4dbcbd2f4eb8c8a0ffe_proximanova_light.woff2") format("woff2");
            }
            @font-face {
                font-family: "Proximanova";
                font-weight: 400;
                font-style: normal;
                font-display: swap;
                src: url("https://cdn.prod.website-files.com/6900d7d25b1ef1963248262d/69bad5b4ca93eddead957d69_proximanova_regular.woff2") format("woff2");
            }
            @font-face {
                font-family: "Proximanova";
                font-weight: 600;
                font-style: normal;
                font-display: swap;
                src: url("https://cdn.prod.website-files.com/6900d7d25b1ef1963248262d/6a73a4f1dbc1eeb2e71b76d1_ProximaNova-Semibold.otf") format("opentype");
            }
            @font-face {
                font-family: "Proximanova";
                font-weight: 700;
                font-style: normal;
                font-display: swap;
                src: url("https://cdn.prod.website-files.com/6900d7d25b1ef1963248262d/69bad4ed8186168091d0a273_proximanova_bold.woff2") format("woff2");
            }
            @font-face {
                font-family: "Proximanova";
                font-weight: 800;
                font-style: normal;
                font-display: swap;
                src: url("https://cdn.prod.website-files.com/6900d7d25b1ef1963248262d/69bad4fa0639d69cd6305886_proximanova_extrabold.woff2") format("woff2");
            }
        </style>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet" />

        <title>Starter kit — Untitled UI</title>
    </head>

    <body class="size-full bg-primary antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            // On page load or when changing themes, best to add inline in `head` to avoid FOUC
            if (localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.classList.add("dark-mode");
            } else {
                document.documentElement.classList.remove("dark-mode");
            }
        </script>
    </body>
</html>
